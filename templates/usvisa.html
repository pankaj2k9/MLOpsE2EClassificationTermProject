<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US Visa Prediction</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- External CSS -->
<link rel="stylesheet" href="{{ url_for('static', path='/css/style.css')}}">

</head>
<body>

<nav class="navbar p-3">
  <div class="container-fluid">
      <span class="navbar-brand mx-auto">US Visa Prediction Portal</span>
  </div>
</nav>

<section>
<div class="container">

  <form action="/" method="post" class="form-container">
      <legend>US Visa Approval Form</legend>

      <div class="mb-3">
          <label>Continent</label>
          <select class="form-control input" name="continent" required>
            <option value="" disabled selected>Select Continent</option>
            <option>Asia</option><option>Africa</option><option>North America</option>
            <option>Europe</option><option>South America</option><option>Oceania</option>
          </select>
      </div>

      <div class="mb-3">
        <label>Education of Employee</label>
        <select class="form-control input" name="education_of_employee" required>
            <option value="" disabled selected>Select Education</option>
            <option>High School</option><option>Master's</option>
            <option>Bachelor's</option><option>Doctorate</option>
        </select>
      </div>

      <div class="mb-3">
        <label>Has Job Experience</label>
        <select class="form-control input" name="has_job_experience" required>
          <option value="" disabled selected>Has Experience</option>
          <option>N</option><option>Y</option>
        </select>
      </div>

      <div class="mb-3">
        <label>Requires Job Training</label>
        <select class="form-control input" name="requires_job_training" required>
          <option value="" disabled selected>Required Training</option>
          <option>N</option><option>Y</option>
        </select>
      </div>

      <div class="mb-3">
        <label>No. of Employees</label>
        <input type="number" class="form-control input" name="no_of_employees" min="14500" max="40000" required placeholder="15000 - 40000">
      </div>

      <div class="mb-3">
        <label>Region of Employment</label>
        <select class="form-control input" name="region_of_employment" required>
          <option value="" disabled selected>Select Region</option>
          <option>West</option><option>Northeast</option>
          <option>South</option><option>Midwest</option><option>Island</option>
        </select>
      </div>

      <div class="mb-3">
        <label>Prevailing Wage</label>
        <input type="number" class="form-control input" name="prevailing_wage" min="600" max="70000" required placeholder="700 - 70000">
      </div>

      <div class="mb-3">
        <label>Contract Tenure</label>
        <select class="form-control input" name="unit_of_wage" required>
          <option value="" disabled selected>Select Tenure</option>
          <option>Hour</option><option>Year</option>
          <option>Week</option><option>Month</option>
        </select>
      </div>

      <div class="mb-3">
        <label>Full or Part Time</label>
        <select class="form-control input" name="full_time_position" required>
          <option value="" disabled selected>Full Time / Part Time</option>
          <option>Y</option><option>N</option>
        </select>
      </div>

      <div class="mb-3">
        <label>Company Age</label>
        <input type="number" class="form-control input" name="company_age" min="15" max="180" required placeholder="10 - 180 years">
      </div>

      <button type="submit" class="btn-submit">Predict Visa Status</button>
  </form>

  <div class="result-box">
    <h2>Visa Prediction Result: <span style="color:#4f46e5">{{ context }}</span></h2>
  </div>

</div>
</section>


<script src="https://code.jquery.com/jquery-3.2.1.js"></script>
<script type="text/javascript">
    $(".input").focus(function(){
        $(this).parent().addClass("focus");
    }).blur(function(){
        if($(this).val() === ''){
            $(this).parent().removeClass("focus");
        }
    })
</script>

</body>
</html>
